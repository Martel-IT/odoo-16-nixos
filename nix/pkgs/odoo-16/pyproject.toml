[tool.poetry]
name = "Odoo Server 16.0"
version = "16.0.20240216"
description = "Odoo Server repackaged con Poetry"
authors = ["Martel IT"]
license = "LGPL-3.0-only"
readme = "README.md"
packages = [{include = "odoo", format = "sdist"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# Usa la versione binary per evitare compilazione
psycopg2-binary = "2.9.9"  # Invece di psycopg2

# Resto identico al file precedente
Pillow = "10.3.0"
gevent = "23.9.0"
cryptography = "42.0.3"
soupsieve = "2.7"
urllib3 = "2.5.0"
setuptools = "78.1.1"
reportlab = "4.2.5"
Jinja2 = "3.1.6"
requests = "2.32.4"
idna = "3.7"
PyPDF2 = "2.12.1"
Werkzeug = "3.0.6"
greenlet = "3.0.3"
MarkupSafe = "2.1.5"
Babel = "2.9.1"
chardet = "4.0.0"
decorator = "4.4.2"
docutils = "0.16"
ebaysdk = "2.1.5"
freezegun = "0.3.15"
libsass = "0.20.1"
lxml = "4.9.3"
num2words = "0.5.9"
ofxparse = "0.21"
passlib = "1.7.4"
polib = "1.1.0"
psutil = "5.9.4"
pydot = "1.4.2"
pyopenssl = "24.1.0"
pyserial = "3.5"
python-dateutil = "2.8.1"

python-stdnum = "1.16"
pytz = "*"
pyusb = "1.2.1"
qrcode = "6.1"
xlrd = "1.2.0"
XlsxWriter = "1.1.2"
xlwt = "1.3.0"
zeep = "4.0.0"
attrs = "22.2.0"
vobject = "0.9.6.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"